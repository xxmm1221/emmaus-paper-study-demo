<div id="emmaus-paper-study">
  <script type="application/json" id="ep-books">__EMMAUS_BOOKS__</script>
  <div class="ep-stage">
    <div class="ep-phone" aria-label="Emmaus 纸间研读">
      <main class="ep-main" aria-label="主阅读场景"></main>
      <div class="ep-floating-layer" aria-label="全局悬浮层"><div class="ep-tabs" aria-label="暂存的悬浮标签"></div><div class="ep-float-slot"></div></div>
      <button type="button" class="ep-drawer-scrim" data-act="drawer-close" aria-label="收起后台" hidden></button>
      <aside class="ep-drawer" role="dialog" aria-modal="true" aria-label="后台阅读场景" hidden>
        <header><span class="ep-wordmark">Emmaus</span><button class="ep-icon" data-act="drawer-close" aria-label="收起后台"><i data-lucide="x"></i></button></header>
        <p class="ep-drawer-caption">在路上，也在话语里。</p>
        <button class="ep-nav-row" data-act="root-directory"><i data-lucide="library"></i><span>书卷目录<small>回到话语的起点</small></span></button>
        <button class="ep-nav-row" data-act="history"><i data-lucide="history"></i><span>历史记录<small>找回阅读与思考的痕迹</small></span></button>
        <div class="ep-saved-heading"><span>阅读场景 <small data-saved-count>0</small></span><button class="ep-text" data-act="new-reading">新建<i data-lucide="plus"></i></button></div>
        <div class="ep-saved-list"></div>
        <footer><button class="ep-text" data-act="export"><i data-lucide="download"></i>导出本地备份</button><small>笔记与历史仅保存在此浏览器</small></footer>
      </aside>
      <button class="ep-menu-scrim" data-act="menu-close" aria-label="关闭窗口菜单" hidden></button>
      <div class="ep-popover" role="menu" aria-label="窗口操作" hidden></div>
      <section class="ep-directory" role="dialog" aria-modal="true" aria-label="选择书卷和章节" hidden></section>
      <section class="ep-history-panel" role="dialog" aria-modal="true" aria-label="历史记录" hidden>
        <header><div><span class="ep-kicker">留下的，不止是页码</span><h2>历史记录</h2></div><button class="ep-icon" data-act="history-close" aria-label="关闭历史记录"><i data-lucide="x"></i></button></header>
        <div class="ep-history-filters"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="reading">阅读</button><button data-filter="note">笔记版本</button><button data-filter="closed">已关闭</button></div>
        <div class="ep-history-list"></div><footer>恢复阅读为独立视图；旧笔记版本恢复为新笔记，不覆盖当前内容。</footer>
      </section>
      <div class="ep-storage-error" role="alert" hidden><span>本地保存失败，请先导出备份，避免刷新后丢失。</span><button data-act="export">导出备份</button></div>
      <div class="ep-toast" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</div>
<style>__EMMAUS_WINDOW_CSS__</style>
<script>__EMMAUS_WINDOW_MODEL__</script>
<script>__EMMAUS_WINDOW_APP__</script>
