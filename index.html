&lt;style&gt;#emmaus-paper-study { color-scheme:light dark; }
#emmaus-paper-study .ep-stage { display:flex;justify-content:center;min-height:854px;padding:24px 10px 30px;box-sizing:border-box; }
#emmaus-paper-study .ep-phone {

  --serif:&quot;Noto Serif SC&quot;,&quot;Source Han Serif SC&quot;,&quot;Songti SC&quot;,SimSun,serif;--sans:&quot;Noto Sans SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
  width:100%;max-width:424px;height:800px;position:relative;overflow:hidden;isolation:isolate;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:32px;box-shadow:0 24px 64px var(--shadow);font:400 14px/1.7 var(--sans);touch-action:pan-y;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
#emmaus-paper-study .ep-phone * { box-sizing:border-box; }
#emmaus-paper-study [hidden] { display:none!important; }
#emmaus-paper-study button { font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent; }
#emmaus-paper-study button:disabled { opacity:.28;cursor:default; }
#emmaus-paper-study button:not(:disabled):active { opacity:.65; }
#emmaus-paper-study button:focus-visible,#emmaus-paper-study textarea:focus-visible { outline:2px solid var(--accent);outline-offset:-3px; }
#emmaus-paper-study svg { width:18px;height:18px;stroke-width:1.6;flex-shrink:0; }
#emmaus-paper-study .ep-icon { width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0; }
#emmaus-paper-study .ep-text { display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:44px;padding:0 10px;font-size:12px;white-space:nowrap; }
#emmaus-paper-study .ep-kicker { font:400 11px/1.7 var(--sans);letter-spacing:1.5px;color:var(--muted); }
#emmaus-paper-study .ep-wordmark { font:400 29px/1 Georgia,serif;letter-spacing:-1px; }
#emmaus-paper-study .ep-main { position:absolute;inset:0;transition:transform 360ms var(--ease); }
#emmaus-paper-study .ep-main-scene { position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper); }

#emmaus-paper-study .ep-scene-head&gt;span { flex:1;font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center; }
#emmaus-paper-study .ep-scene-body { display:flex;flex-direction:column;flex:1;min-height:0;position:relative; }
#emmaus-paper-study .ep-pane { display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden;position:relative;background:var(--paper); }
#emmaus-paper-study .ep-pane-head { position:relative;display:flex;align-items:center;gap:1px;min-height:52px;height:52px;padding:3px 12px;flex-shrink:0;transition:opacity 220ms; }
#emmaus-paper-study .ep-pane-title { flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;height:44px;padding-left:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

#emmaus-paper-study .ep-pane-head&gt;.ep-icon { width:38px;color:var(--muted); }
#emmaus-paper-study .ep-scroll { flex:1;min-height:0;overflow:auto;overscroll-behavior:none;overflow-anchor:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:15px 28px 100px; }

#emmaus-paper-study .ep-pane-actions { position:absolute;bottom:19px;left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:4px 7px;background:var(--sheet);box-shadow:0 5px 30px var(--shadow);border:1px solid var(--line);border-radius:28px;white-space:nowrap;transition:opacity 200ms,transform 280ms var(--ease); }

#emmaus-paper-study .ep-pane.is-quiet&gt;.ep-pane-head { opacity:0;pointer-events:none; }

#emmaus-paper-study .ep-floating-layer { position:absolute;inset:0;pointer-events:none;z-index:5; }
